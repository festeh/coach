name: Build and deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: coach-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: coach-deploy

    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: admin/.node-version
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install the pinned npm release
        run: npm install --global npm@12.0.1

      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          cache: true

      - name: Build and test the immutable release
        run: ./scripts/build-release

      - name: Configure pinned production SSH access
        env:
          DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
        run: |
          install -d -m 0700 ~/.ssh
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > ~/.ssh/coach_deploy
          chmod 0600 ~/.ssh/known_hosts ~/.ssh/coach_deploy

      - name: Upload and atomically activate the release
        run: |
          release_id="$(cat build/coach.sha256)"
          ssh_args=(
            -i ~/.ssh/coach_deploy
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            "$DEPLOY_USER@$DEPLOY_HOST"
          )
          ssh "${ssh_args[@]}" "upload $release_id" < build/coach.tar.gz
          ssh "${ssh_args[@]}" "activate $release_id"
          active_release="$(ssh "${ssh_args[@]}" status)"
          test "$active_release" = "$release_id"
